plugins {
    id "com.android.application"
}

def releaseKeystore = System.getenv("ANDROID_KEYSTORE_PATH")

android {
    namespace "com.mhub.voice"
    compileSdk 35

    defaultConfig {
        applicationId "com.mhub.voice"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "1.1.0"
    }

    signingConfigs {
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // CI uses a managed keystore when secrets are present. Without
            // them the APK stays debug-signed for direct sideloading.
            signingConfig releaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
